# keyd: пер-девайсный ремап для мыши Zelotes C-18 (12c9:2003).
#
# Важно: в keyd секция [ids] выбирает устройство, а [main] и [zelotes-c18] —
# это слои. Файл целиком применяется только к 12c9:2003, поэтому клавиатура
# DEXP First Blood (1a2c:635a) не затрагивается.
#
# У мыши есть отдельный интерфейс «эмуляция клавиатуры» (hidraw1). Джойстик
# по умолчанию шлёт обычные W/S/A/D/Space, поэтому их можно remap'ить keyd.
# Точные имена кнопок проверяйте заранее:
#   sudo keyd monitor
#
# Установка:
#   sudo install -Dm644 devices/keyd/zelotes-c18.conf /etc/keyd/zelotes-c18.conf
#   sudo keyd reload
#
# Если keyd ругается, что id 12c9:2003 одновременно мышь и клавиатура,
# замените строку в [ids] на k:12c9:2003 (нужен именно keyboard-интерфейс).

[ids]
12c9:2003

[main]
# Джойстик: W/S/A/D -> стрелки.
w = up
s = down
a = left
d = right

# Центр джойстика (пробел) оставляем пробелом: нажатие вниз часто случайное.
space = space

# Боковая кнопка удерживает слой zelotes-c18. Если ваша прошивка называет
# боковую кнопку иначе, посмотрите её имя в keyd monitor: mouseback,
# mouseforward, mouse1 или mouse2.
mouseback = layer(zelotes-c18)

# Пример макроса на второй боковой кнопке: Ctrl+C.
mouseforward = macro(C-c)

# Слой zelotes-c18: альтернативные действия, пока зажата боковая кнопка.
# Здесь тоже работают реальные keyd-имена: pageup/pagedown/home/end/enter.
[zelotes-c18]
w = pageup
s = pagedown
a = home
d = end
space = enter
