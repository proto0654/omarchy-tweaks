# Прочие приложения на WebKitGTK (Epiphany, Tauri-приложения и т.п.) на Wayland
# с NVIDIA падают с "Error 71 (Protocol error)" без этой переменной. Сама
# переменная ломает прозрачные окна, поэтому сам Telegram её отключает у себя
# (см. telegram-webview/dropin.conf).
WEBKIT_DISABLE_DMABUF_RENDERER=1
