# Мини-апки Telegram: GTK-вебвью (WebKitGTK) на этой машине.
# Корень проблемы: DMA-BUF рендерер WebKit падает на NVIDIA (Wayland — Error 71,
# X11 — GBM buffer failed), а костыль WEBKIT_DISABLE_DMABUF_RENDERER=1 на
# WebKitGTK 2.54 ломает прозрачные окна (рисуются только повреждённые области).
# Окно мини-апки у tdesktop как раз прозрачное.
# Решение: DMA-BUF не отключаем, а уводим EGL на Mesa (Intel iGPU).
[Service]
Environment=GDK_SCALE=1
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
UnsetEnvironment=WEBKIT_DISABLE_DMABUF_RENDERER
UnsetEnvironment=WEBKIT_DISABLE_COMPOSITING_MODE
